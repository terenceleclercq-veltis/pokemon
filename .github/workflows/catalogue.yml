# Applique web/seed.sql (catalogue versionné) à un environnement. Idempotent et non destructif.
name: Catalogue

on:
  workflow_dispatch:
    inputs:
      environment:
        type: choice
        options: [staging, production]
        required: true

permissions:
  contents: read

concurrency:
  group: deploy-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  seed:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: ${{ inputs.environment }}
    defaults:
      run:
        working-directory: web
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      ENV: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm install -g npm@11.21.1 && npm ci
      - run: node scripts/check-env.mjs "$ENV"
      - name: Sauvegarde avant modification
        run: npx wrangler d1 export DB --remote --env "$ENV" --output "backup-$ENV.sql"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backup-${{ inputs.environment }}-${{ github.run_id }}
          path: web/backup-*.sql
          retention-days: 30
      - run: npx wrangler d1 migrations apply DB --remote --env "$ENV"
      - run: npx wrangler d1 execute DB --remote --env "$ENV" --file=seed.sql -y
