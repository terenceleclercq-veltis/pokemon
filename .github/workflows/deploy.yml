# Livraison continue (GitOps) : main = source de vérité.
# push sur main -> CI -> staging (automatique) -> production (approbation manuelle via l'environnement GitHub).
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Verrou par environnement dans _deploy-env.yml (pas ici) : une production en attente d'approbation ne bloque plus
# la CI ni le staging des commits suivants.

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
      pull-requests: write

  staging:
    needs: ci
    uses: ./.github/workflows/_deploy-env.yml
    with:
      environment: staging
    secrets: inherit

  production:
    needs: staging
    uses: ./.github/workflows/_deploy-env.yml
    with:
      environment: production
    secrets: inherit
