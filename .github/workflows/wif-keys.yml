# Clé de signature de la fédération d'identité Claude (Workload Identity Federation), lancée à la main :
# la clé privée est générée ici et part directement dans le secret Worker WIF_PRIVATE_JWK de l'environnement, sans
# jamais être affichée ; la clé publique est écrite dans le résumé du job, à coller dans la console Claude
# (JWKS « inline » de l'émetteur). Sert aussi à la rotation. Voir docs/gitops.md, « Analyse par Claude ».
name: Clé de fédération Claude

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Environnement
        type: choice
        options: [staging, production]
        required: true

permissions:
  contents: read

# même verrou que les déploiements : une clé n'est jamais écrite pendant un déploiement
concurrency:
  group: deploy-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  key:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: ${{ inputs.environment }}
    defaults:
      run:
        working-directory: web
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER_SEND_METRICS: "false"
      ENV: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm install -g npm@11.21.1 && npm ci
      # L'entrée passe par une variable d'environnement (pas d'interpolation dans le script : anti-injection).
      - name: Nouvelle clé (privée -> secret Worker, publique -> résumé)
        run: |
          pub=$(node scripts/wif-keys.mjs "$ENV")
          {
            echo "### Clé publique de signature ($ENV)"
            echo
            echo "À ajouter au JWKS inline de l'émetteur, dans la console Claude :"
            echo
            echo '```json'
            echo "$pub"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "clé publique : $pub"
