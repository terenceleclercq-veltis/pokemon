# Chaque semaine : signale dans une issue les IR/SIR parues depuis le dernier relevé du catalogue. Lecture seule
# côté données (aucun déploiement) ; l'ajout au catalogue reste une PR vérifiée à la main.
name: Veille catalogue

on:
  schedule:
    - cron: "17 5 * * 1" # lundi 05:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  veille:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - run: pip install --quiet requests==2.32.5
      - run: python scripts/08_veille_catalogue.py veille.md
      - name: Ouvre ou met à jour l'issue de veille
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          titre="Veille catalogue : nouvelles IR/SIR"
          num=$(gh issue list --state open --search "\"$titre\" in:title" --json number --jq '.[0].number // empty')
          if [ ! -s veille.md ]; then
            echo "Rien de neuf."
            [ -n "$num" ] && gh issue close "$num" --comment "Plus rien en attente : catalogue à jour."
            exit 0
          fi
          if [ -n "$num" ]; then
            gh issue edit "$num" --body-file veille.md
          else
            gh issue create --title "$titre" --body-file veille.md
          fi
