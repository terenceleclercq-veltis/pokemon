# Déploiement d'un environnement : garde-fous -> migrations D1 -> déploiement -> smoke test -> rollback si échec.
name: Déployer un environnement

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string

permissions:
  contents: read

defaults:
  run:
    working-directory: web

jobs:
  deploy:
    name: ${{ inputs.environment }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: ${{ inputs.environment }}
      url: ${{ vars.APP_URL }}
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER_SEND_METRICS: "false"
      ENV: ${{ inputs.environment }}
      # Smoke tests via workers.dev : le Bot Fight Mode de veltis.be bloque les IP des runners GitHub.
      # Même application Access (même AUD) que le domaine personnalisé.
      SMOKE_URL: https://pokedex-kanto-${{ inputs.environment }}.terence-leclercq.workers.dev
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm install -g npm@11.21.1
      - run: npm ci

      - name: Garde-fou - configuration complète
        run: node scripts/check-env.mjs "$ENV"
      - name: Garde-fou - secret de chiffrement présent
        run: npx wrangler secret list --env "$ENV" --format json | node scripts/require-secret.mjs ENC_KEY
      - name: Version actuellement en ligne (pour rollback)
        id: before
        run: echo "version=$(npx wrangler deployments status --env "$ENV" --json 2>/dev/null | node scripts/current-version.mjs)" >> "$GITHUB_OUTPUT"

      - name: Migrations D1 (compatibles avec la version précédente)
        run: npx wrangler d1 migrations apply DB --remote --env "$ENV"

      - name: Déploiement
        run: npx wrangler deploy --env "$ENV" --message "deploy ${GITHUB_SHA::7} par ${GITHUB_ACTOR}" --tag "${GITHUB_SHA::7}"

      - name: Smoke test (service token Access)
        env:
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          for i in 1 2 3 4 5; do
            code=$(curl -sS -o health.json -w '%{http_code}' \
              -H "CF-Access-Client-Id: $CF_ACCESS_CLIENT_ID" -H "CF-Access-Client-Secret: $CF_ACCESS_CLIENT_SECRET" \
              "$SMOKE_URL/api/health") || true
            [ "$code" = 200 ] && grep -q '"ok":true' health.json && { cat health.json; exit 0; }
            sleep $((i * 5))
          done
          echo "::error::smoke test en échec (HTTP $code)"; cat health.json || true; exit 1
      - name: Smoke test - accès anonyme refusé
        run: |
          code=$(curl -sS -o /dev/null -w '%{http_code}' --max-redirs 0 "$SMOKE_URL/api/pokedex") || true
          case "$code" in 302|401|403) echo "anonyme refusé ($code)";; *) echo "::error::accès anonyme non bloqué ($code)"; exit 1;; esac

      - name: Rollback automatique
        if: failure() && steps.before.outputs.version != ''
        env:
          PREVIOUS: ${{ steps.before.outputs.version }}
        run: npx wrangler rollback "$PREVIOUS" --env "$ENV" --message "rollback auto ${GITHUB_SHA::7}" -y
